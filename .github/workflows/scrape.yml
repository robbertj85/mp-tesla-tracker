name: Daily scrape

on:
  schedule:
    # 05:17 UTC daily (offset from the hour to be polite / avoid load spikes).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max listings to process (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Two brands (Tesla + Skoda), each with throttled detail-page fetches.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/pyproject.toml

      - name: Install scraper
        run: pip install -e "./scraper[browser]"

      - name: Install Playwright Chromium (detail-page fallback)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python -m mp_tesla.run \
            --run-date "$(date -u +%F)" \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/tesla.json web/public/skoda.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scrape $(date -u +%F)"
            git push
          fi
