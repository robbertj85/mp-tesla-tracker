name: Daily scrape

on:
  schedule:
    # 05:17 UTC daily (offset from the hour to be polite / avoid load spikes).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max listings to process (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Two brands (Tesla + Skoda), each with throttled detail-page fetches.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the post-scrape rebase-onto-latest-main push works.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/pyproject.toml

      - name: Install scraper
        run: pip install -e "./scraper[browser]"

      - name: Install Playwright Chromium (detail-page fallback)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python -m mp_tesla.run \
            --run-date "$(date -u +%F)" \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/tesla.json web/public/skoda.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scrape $(date -u +%F)"
          # A full two-brand scrape runs for many minutes, so origin/main may have
          # advanced meanwhile (a concurrent push), making the push non-fast-forward.
          # Rebase our regenerated-data commit onto the latest main and retry; on a
          # data-file conflict the freshly scraped version wins.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            if ! git rebase origin/main; then
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --theirs -- "$f"
              done
              git add -A
              GIT_EDITOR=true git rebase --continue
            fi
          done
          echo "::error::failed to push scraped data after 5 attempts"; exit 1
